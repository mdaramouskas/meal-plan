<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mike's Fitness</title>
<style>
  :root { --bg:#0d1117;--surface:#161b22;--border:#21262d;--text:#e6edf3;--muted:#8b949e; }
  * { box-sizing:border-box;margin:0;padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px; }
  h1 { font-size:22px;margin-bottom:8px; }
  p { color:var(--muted);font-size:14px;margin-bottom:32px; }
  .cards { display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:420px; }
  a {
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:28px 20px;text-decoration:none;color:var(--text);
    transition:transform .15s,border-color .15s;
  }
  a:hover { transform:translateY(-2px); }
  .icon { font-size:40px;margin-bottom:10px; }
  .label { font-size:16px;font-weight:700; }
  .sub { font-size:12px;color:var(--muted);margin-top:4px; }
  .meals { border-color:#3fb95044; }
  .meals:hover { border-color:#3fb950; }
  .workout { border-color:#58a6ff44; }
  .workout:hover { border-color:#58a6ff; }
</style>
</head>
<body>
  <h1>💪 Mike's Fitness</h1>
  <p>Επίλεξε τι θέλεις να δεις</p>
  <div class="cards">
    <a href="index_tracker.html" class="meals">
      <div class="icon">🥗</div>
      <div class="label">Διατροφή</div>
      <div class="sub">Γεύματα & macros</div>
    </a>
    <a href="workout.html" class="workout">
      <div class="icon">🏋️</div>
      <div class="label">Προπόνηση</div>
      <div class="sub">PUSH · PULL · LEGS · UPPER</div>
    </a>
  </div>
</body>
</html>
